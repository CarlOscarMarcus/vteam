name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appdb
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install backend dependencies
        working-directory: ./backend/api
        run: npm install

      - name: Run backend tests
        working-directory: ./backend/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/appdb
        run: npm test

  web-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install web deps
        working-directory: ./frontend/web
        run: npm install

      - name: Set environment variables
        run: echo "VITE_API_URL=http://localhost:3000" >> $GITHUB_ENV

      - name: Run web tests
        working-directory: ./frontend/web
        run: npm run test:ci

      - name: Lint web
        working-directory: ./frontend/web
        run: npm run lint

  mobile-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install app deps
        working-directory: ./frontend/app
        run: npm install

      # - name: Run app tests
      #   working-directory: ./app
      #   run: npm test -- --watchAll=false

      - name: Lint app
        working-directory: ./frontend/app
        run: npm run lint

